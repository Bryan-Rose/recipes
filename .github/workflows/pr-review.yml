# Claude reviews each pull request and keeps one comment on it up to date.
# Advisory only: not a required check. Needs the ANTHROPIC_API_KEY repository secret.
# A pull_request workflow runs the PR's own code with that secret, so anyone who can push
# a branch here can read it; fork PRs get no secrets and are skipped.
name: PR review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: read

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.26"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
        working-directory: backend
      - run: uv run python -m scripts.pr_review --post-comment
        working-directory: backend
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
