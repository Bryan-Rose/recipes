# Example server setup: Caddy runs in Docker on an external network ("rproxy").
#
#   cp compose.override.example.yml compose.override.yml   # git-ignored; compose loads it automatically
#   docker compose up -d --build
#
# Caddyfile:
#   recipes.example.com {
#       reverse_proxy recipes:80
#   }
#
# Only the frontend joins rproxy: its nginx serves the app and proxies /api to
# the backend over the stack's private network. The backend stays off rproxy,
# so other containers there can't reach the API around nginx.
services:
  frontend:
    # A container can't reach the host's 127.0.0.1, so no host port at all;
    # Caddy connects over rproxy instead.
    ports: !reset []
    networks:
      default:
      rproxy:
        aliases: [recipes]

networks:
  rproxy:
    external: true # create once with: docker network create rproxy
