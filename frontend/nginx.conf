# Per-IP limit on password logins, so one client can't flood the backend's per-username
# lockout table with made-up names (it evicts the oldest) to reset a real user's counter.
# Other requests get an empty key, which nginx doesn't count.
map $request_uri $login_limit_key {
    ~^/api/auth/login(\?|$) $binary_remote_addr;
    default "";
}
limit_req_zone $login_limit_key zone=login:1m rate=10r/m;

server {
    listen 80;
    root /usr/share/nginx/html;

    # The client's address comes from the proxy in front (Caddy, or the host's Docker
    # gateway when Caddy runs on the host), which appends it last to X-Forwarded-For.
    # Only private peers are trusted, so a client reaching nginx directly can't spoof it.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;

    # Compress the recipe list and assets; gzip_proxied covers requests that came through Caddy.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    # Same job as the Vite dev proxy: strip /api and forward to FastAPI, so the
    # browser only ever talks to one origin (no CORS, session cookie just works).
    location /api/ {
        # Resolve per request via Docker's DNS, so a recreated backend container
        # (new IP) doesn't leave nginx proxying to the old address.
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A URL import takes up to 118s: page fetch, Claude parse, picture fetch, the fetches each overrunning by a read (app/routers/imports.py).
        proxy_read_timeout 120s;
        # Up to 4 photos as base64 JPEG (app/schemas/imports.py); nginx's default is 1 MB.
        client_max_body_size 25m;
        # 10 logins a minute per client after a burst of 30: a lockout-eviction
        # flood of 10,000 names takes a single address over 16 hours.
        limit_req zone=login burst=30 nodelay;
        limit_req_status 429;
        error_page 429 = @too_many_logins;
    }

    # JSON like the backend's own 429, so the login page shows the message.
    location @too_many_logins {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"detail":"Too many sign-in attempts. Try again later."}';
    }

    # Vite fingerprints these filenames, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Revalidate the SPA shell on every load: a stale copy would point at hashed
    # assets that the next deploy removed, and the app would load blank.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routes (/recipes/1, /login, ...) all serve the SPA.
    location / {
        try_files $uri /index.html;
    }
}
